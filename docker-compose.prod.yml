name: margin-prod

services:
  api:
    build:
      context: ./backend
      args:
        EXTRAS: ".[parsing,rag,agent,db]"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+asyncpg://margin:margin@postgres:5432/margin
      VALKEY_URL: redis://valkey:6379/0
      GROBID_URL: http://grobid:8070
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
      - postgres
      - valkey
      - grobid

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: margin
      POSTGRES_PASSWORD: margin
      POSTGRES_DB: margin
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey_data:/data

  grobid:
    image: lfoppiano/grobid:0.8.1

volumes:
  qdrant_data:
  postgres_data:
  valkey_data:
