name: margin

services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+asyncpg://margin:margin@postgres:5432/margin
      VALKEY_URL: redis://valkey:6379/0
      GROBID_URL: http://grobid:8070
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
      - postgres
      - valkey
      - grobid

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE: /api/v1
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: margin
      POSTGRES_PASSWORD: margin
      POSTGRES_DB: margin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

  grobid:
    image: lfoppiano/grobid:0.8.1
    ports:
      - "8070:8070"

volumes:
  qdrant_data:
  postgres_data:
  valkey_data:
