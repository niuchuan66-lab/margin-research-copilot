[project]
name = "margin-api"
version = "0.1.0"
description = "Margin — a research copilot for reading, tracing and writing with papers"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "niuchuanbo" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1.0",
  "networkx>=3.3,<4.0",
]

[project.optional-dependencies]
parsing = [
  "docling>=2.0",
  "paddleocr>=2.9",
  "pypdfium2>=4.30",
  "pypdf>=5.0",
  "rapidocr-onnxruntime>=1.4",
  "wordninja>=2.0",
]
rag = [
  "llama-index-core>=0.11",
  "qdrant-client>=1.12",
  "rank-bm25>=0.2.2",
  "FlagEmbedding>=1.3",
]
agent = ["langgraph>=0.2"]
db = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "alembic>=1.13"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
